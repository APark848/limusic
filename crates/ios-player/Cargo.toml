[package]
name = "ios-player"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.80"
description = "Limusic's native iOS AVFoundation playback bridge"
build = "build.rs"
links = "limusic-ios-player"

[dependencies]
serde = { workspace = true }
tauri = { version = "2", default-features = false }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }

[package.metadata.platforms.support.ios]
level = "partial"
notes = "Basic foreground audio playback through AVPlayer"
