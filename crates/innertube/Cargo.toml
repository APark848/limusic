[package]
name = "innertube"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "json"] }
tokio = { workspace = true, features = ["time", "sync"] }
sha1 = "0.10"
hex = "0.4"
urlencoding = "2"

# The rustypipe safety net embeds QuickJS and is only used by the desktop application. Mobile
# targets keep the same fallback API but report it unavailable until they have a native strategy.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
rustypipe = { version = "0.11", default-features = false, features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }

[features]
# Opt-in live-YouTube smoke tests — NOT in the default `cargo test` run.
integration-tests = []
