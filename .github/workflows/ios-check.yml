name: iOS validation

# This creates no release artifacts, signs nothing, and has no repository write permission. It
# keeps the deterministic simulator path blocking while reporting upstream service availability
# separately from application regressions.
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ios-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    # macos-15 provides the Xcode 16 toolchain and an arm64 simulator SDK,
    # so aarch64-apple-ios-sim exercises the target the generated Tauri project will use.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Frontend dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Frontend build
        working-directory: ui
        run: pnpm build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2

      # Deterministic host tests for the iOS stream boundary. This does not claim that YouTube is
      # reachable; it protects the AVPlayer-compatible AAC choice and header allowlist.
      - name: iOS playback boundary tests
        run: |
          cargo test -p innertube ios_format_prefers_native_aac_over_higher_ranked_opus
          cargo test -p ios-player

      - name: Xcode and CocoaPods
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-path
          xcrun --sdk iphonesimulator --show-sdk-version
          pod --version

      # Pin the Cargo CLI to the same version used by the desktop workflow.
      - name: Tauri CLI
        run: cargo install tauri-cli --version 2.11.5 --locked

      # Generated Apple sources are intentionally not committed by CI. On the first run this
      # produces a reviewable artifact; a later dedicated change can add the generated project to
      # version control once its identity/configuration is reviewed.
      - name: Initialize iOS project
        shell: bash
        run: |
          set -o pipefail
          if [ -d src-tauri/gen/apple ]; then
            echo "existing generated Apple project found"
          else
            cargo tauri ios init --ci 2>&1 | tee ios-init.log
          fi

      - name: Validate generated Cargo Xcode script
        shell: bash
        run: |
          set -euo pipefail
          grep -F "cargo tauri ios xcode-script" src-tauri/gen/apple/project.yml
          if grep -Fq "node tauri ios xcode-script" src-tauri/gen/apple/project.yml; then
            echo "generated Xcode project uses the invalid Node launcher" >&2
            exit 1
          fi

      # Keep this command failing on compiler/configuration errors. The artifact step below still
      # captures the generated project and logs, but no error is hidden with continue-on-error.
      - name: Build iOS simulator
        shell: bash
        run: |
          set -o pipefail
          cargo tauri ios build --debug --target aarch64-sim \
            --features ios-player-self-test \
            --config '{"build":{"beforeBuildCommand":""}}' 2>&1 | tee ios-build.log

      # Headless debug validation: drives the production Rust -> plugin -> AVPlayer -> callback
      # event path with a deterministic local WAV. It does not use an account or network stream.
      - name: Smoke test iOS AVPlayer
        shell: bash
        run: |
          set -Eeuo pipefail

          simulator_name="iPhone 16"
          sdk_version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          runtime="com.apple.CoreSimulator.SimRuntime.iOS-${sdk_version//./-}"
          simulator_udid="$(
            xcrun simctl list devices available -j |
              jq -r --arg runtime "$runtime" --arg name "$simulator_name" \
                '.devices[$runtime][]? | select(.name == $name) | .udid' |
              head -n 1
          )"
          if [ -z "$simulator_udid" ]; then
            echo "No available $simulator_name for iOS $sdk_version" >&2
            xcrun simctl list devices available
            exit 1
          fi

          diagnostics_dir="simulator-diagnostics"
          mkdir -p "$diagnostics_dir"
          capture_failure() {
            set +e
            echo "Capturing simulator diagnostics after launch failure"
            xcrun simctl spawn "$simulator_udid" log show \
              --style compact --last 3m \
              --predicate 'process == "limusic" OR eventMessage CONTAINS[c] "com.limusic.desktop"' \
              > "$diagnostics_dir/system.log" 2>&1
            find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 \
              -type f -iname 'limusic*' -exec cp {} "$diagnostics_dir/" \; 2>/dev/null
          }
          fail() {
            trap - ERR
            echo "$1" >&2
            capture_failure
            exit 1
          }
          shutdown_simulator() {
            xcrun simctl shutdown "$simulator_udid" >/dev/null 2>&1 || true
          }
          trap capture_failure ERR
          trap shutdown_simulator EXIT

          # Start from a known state even if the hosted runner left this device booted.
          shutdown_simulator
          echo "Booting $simulator_name ($simulator_udid), iOS $sdk_version"
          xcrun simctl boot "$simulator_udid"
          xcrun simctl bootstatus "$simulator_udid" -b

          app_bundle="$(find src-tauri/gen/apple/build/arm64-sim -maxdepth 1 \
            -type d -name '*.app' -print -quit)"
          if [ -z "$app_bundle" ]; then
            fail "Could not locate the generated simulator app bundle"
          fi
          bundle_id="$(plutil -extract CFBundleIdentifier raw "$app_bundle/Info.plist")"
          echo "Installing $app_bundle ($bundle_id)"
          xcrun simctl install "$simulator_udid" "$app_bundle"
          data_container="$(xcrun simctl get_app_container "$simulator_udid" "$bundle_id" data)"
          # Do not let a marker from a previous install on a reused simulator satisfy this run.
          find "$data_container" -name ios-frontend-ready.json -delete
          result_file=""

          set +e
          launch_output="$(xcrun simctl launch "$simulator_udid" "$bundle_id" 2>&1)"
          launch_status=$?
          set -e
          printf '%s\n' "$launch_output" | tee simulator-launch.log
          if [ "$launch_status" -ne 0 ]; then
            fail "simctl could not launch $bundle_id"
          fi
          app_pid="$(printf '%s\n' "$launch_output" | awk -F ': ' 'END { print $2 }')"
          if ! [[ "$app_pid" =~ ^[0-9]+$ ]]; then
            fail "Could not parse the launched process id"
          fi

          # A running process is not enough: `create: false` can leave the app alive with no
          # WKWebView. This file is written by a command invoked from Svelte's root onMount in the
          # configured `main` webview, proving both native window creation and frontend startup.
          frontend_ready_file=""
          for _ in $(seq 1 30); do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              fail "Limusic exited before frontend startup (pid $app_pid)"
            fi
            frontend_ready_file="$(find "$data_container" -name ios-frontend-ready.json -print -quit)"
            if [ -n "$frontend_ready_file" ]; then
              break
            fi
            sleep 1
          done
          if [ -z "$frontend_ready_file" ]; then
            fail "Timed out waiting for the main iOS WebView to reach frontend startup"
          fi
          cp "$frontend_ready_file" ios-frontend-ready.json
          cat ios-frontend-ready.json
          if ! jq -e '.status == "ready" and .window == "main"' \
            ios-frontend-ready.json >/dev/null; then
            fail "The iOS frontend-ready marker was malformed or came from the wrong window"
          fi
          echo "Main iOS WebView reached frontend startup"

          # Diagnostics reads this exact persistent file. Requiring the frontend marker in it
          # proves iOS initialized the shared logger early enough to capture WebView/playback logs.
          persistent_log="$(find "$data_container" -name limusic.log -print -quit)"
          if [ -z "$persistent_log" ]; then
            fail "iOS did not create the persistent diagnostics log"
          fi
          if ! grep -Fq "iOS frontend ready" "$persistent_log"; then
            fail "The persistent iOS log did not capture frontend startup"
          fi
          echo "Persistent iOS diagnostics logging is active"

          for _ in $(seq 1 60); do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              fail "Limusic exited during the AVPlayer self-test (pid $app_pid)"
            fi
            result_file="$(find "$data_container" -name ios-player-self-test.json -print -quit)"
            if [ -n "$result_file" ]; then
              result_status="$(jq -r '.status' "$result_file")"
              if [ "$result_status" = "passed" ] || [ "$result_status" = "failed" ]; then
                break
              fi
            fi
            sleep 1
          done
          if [ -z "$result_file" ]; then
            fail "Timed out waiting for the AVPlayer self-test result"
          fi
          cp "$result_file" ios-player-self-test.json
          cat ios-player-self-test.json
          if [ "$(jq -r '.status' ios-player-self-test.json)" = "running" ]; then
            fail "Timed out while the AVPlayer self-test was running"
          fi
          if [ "$(jq -r '.status' ios-player-self-test.json)" != "passed" ]; then
            fail "The AVPlayer self-test reported a failure"
          fi
          if ! kill -0 "$app_pid" 2>/dev/null; then
            fail "Limusic exited after the AVPlayer self-test (pid $app_pid)"
          fi
          echo "Limusic AVPlayer self-test passed and the app remains alive (pid $app_pid)"

          # The network leg is a separate result so the deterministic local-player signal remains
          # useful when YouTube or the hosted runner's network is having an external failure.
          remote_result_file=""
          for _ in $(seq 1 60); do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              fail "Limusic exited during the remote-stream self-test (pid $app_pid)"
            fi
            remote_result_file="$(find "$data_container" -name ios-remote-stream-self-test.json -print -quit)"
            if [ -n "$remote_result_file" ]; then
              if ! jq -e 'type == "object" and (.status | type == "string")' \
                "$remote_result_file" >/dev/null 2>&1; then
                break
              fi
              remote_status="$(jq -r '.status' "$remote_result_file")"
              if [ "$remote_status" != "running" ]; then
                break
              fi
            fi
            sleep 1
          done
          if [ -z "$remote_result_file" ]; then
            fail "Timed out waiting for the remote-stream self-test result"
          fi
          cp "$remote_result_file" ios-remote-stream-self-test.json
          cat ios-remote-stream-self-test.json

          if ! jq -e 'type == "object" and (.status | type == "string")' \
            ios-remote-stream-self-test.json >/dev/null; then
            fail "The remote-stream self-test produced malformed JSON"
          fi
          remote_status="$(jq -r '.status' ios-remote-stream-self-test.json)"
          case "$remote_status" in
            passed)
              echo "Limusic anonymous remote stream advanced in AVPlayer"
              ;;
            running)
              fail "Timed out while the remote-stream self-test was running"
              ;;
            failed)
              if ! jq -e \
                '(.category | type == "string") and (.stage | type == "string") and (.error | type == "string")' \
                ios-remote-stream-self-test.json >/dev/null; then
                fail "The remote-stream self-test failure result was malformed"
              fi
              category="$(jq -r '.category' ios-remote-stream-self-test.json)"
              stage="$(jq -r '.stage' ios-remote-stream-self-test.json)"
              diagnostic="$(jq -r '.error' ios-remote-stream-self-test.json)"
              case "$category" in
                external-service)
                  # A resolver timeout is a harness/availability timeout, not an advisory result.
                  # Other external stages currently represent AVPlayer's playback timeout and
                  # remain blocking until the result contract can distinguish a prompt HTTP
                  # refusal from a hung test.
                  if [ "$stage" != "resolver" ]; then
                    fail "Remote-stream validation timed out or failed in the harness (category=$category, stage=$stage)"
                  fi
                  diagnostic="${diagnostic//'%'/'%25'}"
                  diagnostic="${diagnostic//$'\r'/'%0D'}"
                  diagnostic="${diagnostic//$'\n'/'%0A'}"
                  echo "::warning title=iOS remote stream unavailable::category=$category; stage=$stage; diagnostic=$diagnostic"
                  ;;
                application)
                  fail "Remote-stream application failure (category=$category, stage=$stage)"
                  ;;
                *)
                  fail "The remote-stream self-test returned an unknown category (category=$category, stage=$stage)"
                  ;;
              esac
              ;;
            *)
              fail "The remote-stream self-test returned an unknown status"
              ;;
          esac
          if ! kill -0 "$app_pid" 2>/dev/null; then
            fail "Limusic exited after the remote-stream self-test (pid $app_pid)"
          fi
          trap - ERR

      - name: Preserve iOS generation and build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-validation-${{ github.run_id }}
          path: |
            ios-init.log
            ios-build.log
            simulator-launch.log
            ios-frontend-ready.json
            ios-player-self-test.json
            ios-remote-stream-self-test.json
            simulator-diagnostics
            src-tauri/gen/apple
          if-no-files-found: warn
          retention-days: 14
